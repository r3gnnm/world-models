<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ttl { font-size: 21px; font-weight: 700; fill: #1a202c; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #4a5568; letter-spacing: .04em; }
      .nm  { font-size: 14px; font-weight: 700; fill: #1a202c; }
      .sm  { font-size: 11.5px; fill: #4a5568; }
      .tag { font-size: 10.5px; fill: #718096; font-style: italic; }
      .edge{ stroke: #4a5568; stroke-width: 1.6; fill: none; }
      .grp { fill: none; stroke: #cbd5e0; stroke-width: 1.2; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1180" height="900" fill="#ffffff"/>

  <text class="ttl" x="40" y="44">Классификация: место проекта среди мировых моделей</text>
  <text class="sm" x="40" y="66">Выделенное синим — характеристики нашей модели</text>

  <!-- ДЕРЕВО -->
  <rect class="grp" x="32" y="88" width="1116" height="300" rx="12"/>
  <text class="sec" x="48" y="112">ТАКСОНОМИЯ ПОДХОДОВ</text>

  <rect x="470" y="130" width="240" height="52" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4"/>
  <text class="nm" x="590" y="161" text-anchor="middle">Обучаемые модели среды</text>

  <rect x="150" y="228" width="270" height="66" rx="9" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.4"/>
  <text class="nm" x="285" y="252" text-anchor="middle">Генеративные (реконструкция)</text>
  <text class="sm" x="285" y="273" text-anchor="middle">предсказывают пиксели / наблюдения</text>

  <rect x="760" y="228" width="270" height="66" rx="9" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text class="nm" x="895" y="252" text-anchor="middle">Негенеративные (JEPA)</text>
  <text class="sm" x="895" y="273" text-anchor="middle">предсказывают представление</text>

  <rect x="60" y="322" width="176" height="50" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2"/>
  <text class="sm" x="148" y="343" text-anchor="middle">Видеомодели</text>
  <text class="tag" x="148" y="360" text-anchor="middle">Genie, Sora, Cosmos</text>

  <rect x="252" y="322" width="176" height="50" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2"/>
  <text class="sm" x="340" y="343" text-anchor="middle">Латентные RSSM</text>
  <text class="tag" x="340" y="360" text-anchor="middle">PlaNet, Dreamer v1–v3</text>

  <rect x="560" y="322" width="176" height="50" rx="9" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.2"/>
  <text class="sm" x="648" y="343" text-anchor="middle">Value-equivalent</text>
  <text class="tag" x="648" y="360" text-anchor="middle">MuZero</text>

  <rect x="800" y="322" width="230" height="50" rx="9" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text class="sm" x="915" y="343" text-anchor="middle">Action-conditioned JEPA</text>
  <text class="tag" x="915" y="360" text-anchor="middle">I/V-JEPA, DINO-WM, PLDM · НАШ ПРОЕКТ</text>

  <path class="edge" d="M560 184 L560 206 L285 206 L285 224" marker-end="url(#ar)"/>
  <path class="edge" d="M620 184 L620 206 L895 206 L895 224" marker-end="url(#ar)"/>
  <path class="edge" d="M240 296 L240 310 L148 310 L148 318" marker-end="url(#ar)"/>
  <path class="edge" d="M330 296 L330 310 L340 310 L340 318" marker-end="url(#ar)"/>
  <path class="edge" d="M850 296 L850 310 L648 310 L648 318" marker-end="url(#ar)"/>
  <path class="edge" d="M930 296 L930 310 L915 310 L915 318" marker-end="url(#ar)"/>

  <!-- ОСИ КЛАССИФИКАЦИИ -->
  <rect class="grp" x="32" y="410" width="1116" height="290" rx="12"/>
  <text class="sec" x="48" y="434">ОСИ КЛАССИФИКАЦИИ — ГДЕ НАХОДИТСЯ НАША МОДЕЛЬ</text>

  <g class="sm">
    <text class="nm" x="60" y="464">Тип обучения</text>
    <text x="60" y="484">с учителем · с подкреплением · <tspan font-weight="700" fill="#2b6cb0">самообучение (SSL)</tspan></text>

    <text class="nm" x="60" y="518">Сигнал обучения</text>
    <text x="60" y="538">пиксельная реконструкция · награда · <tspan font-weight="700" fill="#2b6cb0">предсказание в латенте</tspan></text>

    <text class="nm" x="60" y="572">Роль действий</text>
    <text x="60" y="592">пассивная (только наблюдения) · <tspan font-weight="700" fill="#2b6cb0">action-conditioned</tspan></text>

    <text class="nm" x="60" y="626">Получение поведения</text>
    <text x="60" y="646"><tspan font-weight="700" fill="#2b6cb0">планирование (CEM / MPC)</tspan> · обученная политика (actor-critic)</text>

    <text class="nm" x="620" y="464">Наблюдаемость</text>
    <text x="620" y="484"><tspan font-weight="700" fill="#2b6cb0">MDP (полная)</tspan> · <tspan font-weight="700" fill="#2b6cb0">POMDP (частичная, вариант с GRU)</tspan></text>

    <text class="nm" x="620" y="518">Состояние модели</text>
    <text x="620" y="538"><tspan font-weight="700" fill="#2b6cb0">безпамятное z_t</tspan> · <tspan font-weight="700" fill="#2b6cb0">рекуррентное (z_t, h_t)</tspan> · трансформер</text>

    <text class="nm" x="620" y="572">Задание цели</text>
    <text x="620" y="592">функция награды · <tspan font-weight="700" fill="#2b6cb0">целевое изображение (goal-conditioned)</tspan></text>

    <text class="nm" x="620" y="626">Данные</text>
    <text x="620" y="646"><tspan font-weight="700" fill="#2b6cb0">офлайн, случайная политика</tspan> · онлайн-сбор в цикле</text>

    <text class="nm" x="60" y="680">Защита от коллапса</text>
    <text x="60" y="700"><tspan font-weight="700" fill="#2b6cb0">VICReg (var + cov)</tspan> · EMA target (BYOL) · контрастная</text>
  </g>

  <!-- СРАВНЕНИЕ -->
  <rect class="grp" x="32" y="722" width="1116" height="152" rx="12"/>
  <text class="sec" x="48" y="746">ОТЛИЧИЯ ОТ БЛИЖАЙШИХ АНАЛОГОВ</text>

  <g class="sm">
    <text class="nm" x="60" y="776">vs Dreamer (RSSM)</text>
    <text x="60" y="795">у нас нет декодера в обучении и нет награды: представление держится</text>
    <text x="60" y="813">регуляризацией, поведение — планированием, а не actor-critic</text>

    <text class="nm" x="470" y="776">vs MuZero</text>
    <text x="470" y="795">MuZero учит модель под конкретную</text>
    <text x="470" y="813">награду; наша — task-agnostic,</text>
    <text x="470" y="831">цель задаётся картинкой</text>

    <text class="nm" x="830" y="776">vs Genie / Cosmos</text>
    <text x="830" y="795">те генерируют наблюдаемый мир</text>
    <text x="830" y="813">и требуют огромных вычислений;</text>
    <text x="830" y="831">наша работает на одной GPU</text>
  </g>
</svg>
